<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Acoplamiento unidireccional Basilisk–HDF5–Kratos MPM</title>
  <desc id="desc">Esquema del método: presión de una burbuja junto a una pared rígida, transferencia de cargas por anillos y respuesta de una pared elástica. El desplazamiento no regresa al fluido. No representa resultados de una simulación.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8b3a2f"/></marker>
    <style>
      .panel{fill:#faf9f7;stroke:#d8d3cc;stroke-width:1.5}
      .title{font:700 23px system-ui,sans-serif;fill:#2d5a4e}
      .label{font:17px system-ui,sans-serif;fill:#1a1a1a}
      .note{font:15px system-ui,sans-serif;fill:#5a5a5a}
      .arrow{fill:none;stroke:#8b3a2f;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="308" rx="16" fill="#fff" stroke="#d8d3cc"/>
  <rect class="panel" x="24" y="28" width="280" height="222" rx="12"/>
  <rect class="panel" x="360" y="28" width="280" height="222" rx="12"/>
  <rect class="panel" x="696" y="28" width="280" height="222" rx="12"/>
  <text class="title" x="48" y="67">01 · Fluido</text>
  <text class="label" x="48" y="94">Basilisk · axisimetría</text>
  <circle cx="164" cy="148" r="29" fill="#e4eee9" stroke="#2d5a4e" stroke-width="2.5"/>
  <path d="M77 193H251" stroke="#2d5a4e" stroke-width="5"/>
  <path d="M164 179V189" class="arrow"/>
  <text class="note" x="164" y="226" text-anchor="middle">Presión sobre la pared rígida</text>
  <path class="arrow" d="M313 137H349"/>
  <text class="title" x="384" y="67">02 · Transferencia</text>
  <text class="label" x="384" y="94">HDF5 · unidades SI</text>
  <ellipse cx="500" cy="153" rx="81" ry="35" fill="#fff" stroke="#2d5a4e" stroke-width="2"/>
  <ellipse cx="500" cy="153" rx="56" ry="24" fill="none" stroke="#2d5a4e" stroke-width="1.5"/>
  <ellipse cx="500" cy="153" rx="29" ry="12" fill="#f2e6df" stroke="#8b3a2f" stroke-width="2"/>
  <text class="note" x="500" y="226" text-anchor="middle">Presión → fuerza e impulso</text>
  <path class="arrow" d="M650 137H686"/>
  <text class="title" x="720" y="67">03 · Estructura</text>
  <text class="label" x="720" y="94">Kratos · MPM</text>
  <rect x="753" y="123" width="166" height="67" fill="#e4eee9" stroke="#2d5a4e" stroke-width="2"/>
  <path d="M794 123V190M836 123V190M878 123V190M753 156H919" stroke="#a2b6af" stroke-width="1"/>
  <g fill="#8b3a2f">
    <circle cx="774" cy="140" r="4"/><circle cx="815" cy="140" r="4"/><circle cx="857" cy="140" r="4"/><circle cx="898" cy="140" r="4"/>
    <circle cx="774" cy="174" r="4"/><circle cx="815" cy="174" r="4"/><circle cx="857" cy="174" r="4"/><circle cx="898" cy="174" r="4"/>
  </g>
  <text class="note" x="836" y="226" text-anchor="middle">Respuesta de la pared elástica</text>
  <text class="note" x="500" y="283" text-anchor="middle">Esquema del método · transferencia unidireccional · sin realimentación al fluido</text>
</svg>
